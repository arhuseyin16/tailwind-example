<div [formGroup]="dbsForm">
  <div class="dbs-flex">
    <div class="form-control">
      <app-nz-select
        [fg]="dbsForm"
        [controlName]="dbsForm.value.currencyUnit"
        [formControlName]="'currencyUnit'"
        [optionList]="currencyUnitOptions"
        [label]="'auth-management.currencyUnit'"
        [labelClass]="'text-size-20'"
        ngDefaultControl
      ></app-nz-select>
    </div>
    <div class="form-control">
      <app-nz-select
        [fg]="dbsForm"
        [controlName]="dbsForm.value.companies"
        [formControlName]="'companies'"
        [optionList]="companiesOptions"
        [label]="'auth-management.companies'"
        [labelClass]="'text-size-20'"
        ngDefaultControl
      ></app-nz-select>
    </div>
    <div class="form-control">
      <app-nz-select
        [fg]="dbsForm"
        [controlName]="dbsForm.value.banks"
        [formControlName]="'banks'"
        [optionList]="banksOptions"
        [label]="'auth-management.banks'"
        [labelClass]="'text-size-20'"
        ngDefaultControl
      ></app-nz-select>
    </div>
  </div>
</div>
