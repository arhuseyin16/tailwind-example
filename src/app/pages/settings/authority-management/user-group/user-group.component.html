<div class="user-group-page">
  <div class="user-group-left-menu">
    <div class="new-record">
      <button [ngStyle]="recordBtn ? {'background-color': '#2d639f', 'color': '#fff'} : {'background-color': '#fff', 'color': '#000'}"
              (click)="newRecordModal()">{{'auth-management.addGroup' | translate}}</button>
    </div>
    <div class="filter">
      <button nz-popover
              nzPopoverPlacement="bottomRight"
              [nzPopoverContent]="contentTemplate"
              nzPopoverTrigger="click"
              [(nzPopoverVisible)]="visible"
              [ngStyle]="visible ? {'background-color': '#2d639f', 'color': '#fff'} : {'background-color': '#fff', 'color': '#000'}"
      >
        <img [ngStyle]="visible ? {'display': 'none'} : {'display': 'inherit'}" class="normal-filter" src="assets/icon/döviz-filtre.png">
        <img [ngStyle]="visible ? {'display': 'inherit'} : {'display': 'none'}" class="hover-filter" src="assets/icon/döviz-filtre-hover.png">
        {{'settings-exchange.filter' | translate}}
      </button>
      <ng-template #contentTemplate>
        <div class="filter-popover" [formGroup]="createdForm">
          <div class="form-filter">
            <label>{{'auth-management.user' | translate}}</label>
            <input nz-input formControlName="user" type="text" />
          </div>
          <div class="form-filter">
            <label>{{'auth-management.groupName' | translate}}</label>
            <input nz-input formControlName="groupName" type="text" />
          </div>
          <div class="form-filter">
            <label>{{'auth-management.authScheme' | translate}}</label>
            <nz-select formControlName="authScheme" [nzSize]="'large'" nzAllowClear>
              <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
            </nz-select>
          </div>
          <div class="form-filter">
            <label>{{'auth-management.module' | translate}}</label>
            <nz-select formControlName="module" [nzSize]="'large'" nzAllowClear>
              <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
            </nz-select>
          </div>
          <div class="form-filter">
            <div class="flex">
              <div class="btn-action1">
                <button class="clear-btn" (click)="clear()">{{'settings-exchange.clear' | translate}}</button>
              </div>
              <div class="btn-action2">
                <button class="save-btn" (click)="filterClick()">{{'settings-exchange.inquire' | translate}}</button>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </div>
    <div class="excel-export">
      <button>
        <img class="normal-excel" src="assets/icon/excel.svg">
        <img class="hover-excel" src="assets/icon/hover-excel.svg">
      </button>
    </div>
  </div>
  <div class="user-group-table">
    <app-user-group-table></app-user-group-table>
  </div>
</div>
