<div class="ldap-report">
  <div class="flex">
    <div class="form-control">
      <div class="title">
        {{'system-settings.ldapSyncReport' | translate}}
      </div>
    </div>
    <div class="form-control">
      <div class="filter">
        <button nz-popover
                nzPopoverPlacement="bottom"
                [nzPopoverContent]="contentTemplate"
                nzPopoverTrigger="click"
                [(nzPopoverVisible)]="visible"
                [ngStyle]="visible ? {'background-color': '#2d639f', 'color': '#fff'} : {'background-color': '#fff', 'color': '#000'}"
        >
          <img [ngStyle]="visible ? {'display': 'none'} : {'display': 'inherit'}" class="normal-filter" src="assets/icon/döviz-filtre.png">
          <img [ngStyle]="visible ? {'display': 'inherit'} : {'display': 'none'}" class="hover-filter" src="assets/icon/döviz-filtre-hover.png">
          {{'settings-exchange.filter' | translate}}
        </button>
        <ng-template #contentTemplate>
          <div class="filter-popover" [formGroup]="createdForm">
            <div class="form-filter">
              <label>{{'system-settings.startDate' | translate}}</label>
              <nz-date-picker  nzFormat="dd/MM/yyyy" nzPlaceHolder="gg/aa/yyyy" formControlName="startDate"></nz-date-picker>
            </div>
            <div class="form-filter">
              <label>{{'system-settings.endDate' | translate}}</label>
              <nz-date-picker  nzFormat="dd/MM/yyyy" nzPlaceHolder="gg/aa/yyyy" formControlName="endDate"></nz-date-picker>
            </div>
            <div class="form-filter">
              <label>{{'system-settings.status' | translate}}</label>
              <nz-select formControlName="status" [nzSize]="'large'" nzAllowClear>
                <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
              </nz-select>
            </div>
            <div class="form-filter">
              <label>{{'system-settings.description' | translate}}</label>
              <input nz-input formControlName="description" type="text" />
            </div>
            <div class="form-filter">
              <div class="flex">
                <div class="btn-action1">
                  <button class="clear-btn" (click)="clear()">{{'settings-exchange.clear' | translate}}</button>
                </div>
                <div class="btn-action2">
                  <button class="save-btn">{{'settings-exchange.inquire' | translate}}</button>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <div class="base-table ldap-report-table">
    <nz-table
      #rowSelectionTable
      nzShowSizeChanger
      [nzData]="listOfData"
      [nzPageSize]="10"
      [nzItemRender]="paginationItemRender"
      [nzShowTotal]="rangeTemplate"
      [nzShowSizeChanger]="true"
      [nzPageSizeOptions]="pageSize"
    >
      <thead>
      <tr>
        <th [nzEllipsis]="true" *ngFor="let column of listOfColumn" [nzSortFn]="column.compare" [nzSortOrder]="column.sortOrder" width="{{column.width}}">
          {{column.title | translate}}
        </th>
      </tr>
      </thead>
      <tbody>
      <tr  [ngStyle]="{'background-color': i%2 ? '#fff' : '#f5f5f5' }" *ngFor="let data of rowSelectionTable.data; let i = index">
        <ng-container>
          <td>{{ data.id }}</td>
          <td>{{ data.workTime }}</td>
          <td>{{ data.status }}</td>
          <td>{{ data.description }}</td>
        </ng-container>
      </tr>
      </tbody>
      <ng-template #rangeTemplate let-range="range" let-total>
        <div class="absolute left-0 text-16">
          {{ total | number: '2.0' }} Kayıttan {{ range[0] }}-{{ range[1] }} arası
        </div>
      </ng-template>
      <ng-template #paginationItemRender let-type let-page="page">
        <ng-container [ngSwitch]="type">
          <a *ngSwitchCase="'page'">{{ page }}</a>
          <a *ngSwitchCase="'prev'"><img src="assets/svg/left-single-arrow.svg"/></a>
          <a *ngSwitchCase="'next'"><img src="assets/svg/right-single-arrow.svg"/></a>
          <a *ngSwitchCase="'prev_5'"><img src="assets/svg/left-double-arrow.svg"/></a>
          <a *ngSwitchCase="'next_5'"><img src="assets/svg/right-double-arrow.svg"/></a>
        </ng-container>
      </ng-template>
    </nz-table>
  </div>
</div>
