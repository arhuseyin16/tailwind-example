<div class="holiday">
  <div class="holiday-header">
  </div>
  <div class="base-table holiday-table">
    <nz-table
      #rowSelectionTable
      nzShowSizeChanger
      [nzData]="listOfData"
      [nzPageSize]="10"
      [nzShowSizeChanger]="true"
      [nzPageSizeOptions]="pageSize"
      [nzItemRender]="paginationItemRender"
      [nzShowTotal]="rangeTemplate"
      (nzCurrentPageDataChange)="onCurrentPageDataChange($event)"
    >
      <thead>
      <tr>
        <th [nzEllipsis]="true"
            *ngFor="let column of listOfColumn"
            [nzSortFn]="column.compare"
            [nzSortOrder]="column.sortOrder"
            [nzShowSort]="column.sort"
            width="{{column.width}}">
          {{column.title | translate}}
        </th>
      </tr>
      </thead>
      <tbody>
      <tr  [ngStyle]="{'background-color': i%2 ? '#fff' : '#f5f5f5' }" *ngFor="let data of rowSelectionTable.data; let i = index">
        <ng-container>
          <td>{{ data.name }}</td>
          <td>{{ data.description }}</td>
          <td>{{ data.date }}</td>
          <td></td>
        </ng-container>
      </tr>
      </tbody>
      <ng-template #rangeTemplate let-range="range" let-total>
        <div class="absolute left-0 text-16">
          {{ total | number: '2.0' }} Kayıttan {{ range[0] }}-{{ range[1] }} arası
        </div>
      </ng-template>
      <ng-template #paginationItemRender let-type let-page="page">
        <ng-container [ngSwitch]="type">
          <a *ngSwitchCase="'page'">{{ page }}</a>
          <a *ngSwitchCase="'prev'"><img src="assets/svg/left-single-arrow.svg"/></a>
          <a *ngSwitchCase="'next'"><img src="assets/svg/right-single-arrow.svg"/></a>
          <a *ngSwitchCase="'prev_5'"><img src="assets/svg/left-double-arrow.svg"/></a>
          <a *ngSwitchCase="'next_5'"><img src="assets/svg/right-double-arrow.svg"/></a>
        </ng-container>
      </ng-template>
    </nz-table>
  </div>
</div>
