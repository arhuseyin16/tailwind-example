<div class="system-document-table">
  <nz-table
    #rowSelectionTable
    nzShowSizeChanger
    [nzData]="listOfData"
    [nzPageSize]="10"
    [nzShowSizeChanger]="true"
    [nzPageSizeOptions]="pageSize"
  >
    <thead>
    <tr>
      <th [nzEllipsis]="true" *ngFor="let column of listOfColumn" width="{{column.width}}">
        {{column.title | translate}}
      </th>
    </tr>
    </thead>
    <tbody>
    <tr  [ngStyle]="{'background-color': i%2 ? '#fff' : '#f5f5f5' }" *ngFor="let data of rowSelectionTable.data; let i = index">
      <ng-container>
        <td>{{ data.module }}</td>
        <td>{{ data.documentName }}</td>
        <td>{{ data.version }}</td>
        <td></td>
      </ng-container>
    </tr>
    </tbody>
  </nz-table>
</div>
