<!--<app-dashboard-header (isSwitch)="test()"></app-dashboard-header>-->
<div class="dashboard">
  <div class="module">
    <div class="module-list" *ngFor="let item of moduleList">
      <div *ngIf="item.status">
        <div class="card" (click)="goToModuleUrl(item.url)">
          <div class="module-image">
            <img class="image" src="{{item.image}}" />
            <img class="light-image" src="{{item.lightImage}}" />
          </div>
          <div class="module-title mt-4">
            <div class="title">
              {{item.name | translate}}
            </div>
            <div class="icon">
              <span nz-icon nzType="right" nzTheme="outline"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
