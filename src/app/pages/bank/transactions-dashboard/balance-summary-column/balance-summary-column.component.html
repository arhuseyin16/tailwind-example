<div class="money-flow">
  <div class="today-money">
    <div class="money-list" *ngFor="let item of moneyList">
      <div class="card">
        <div class="item flex">
          <span class="label basis-1/3">{{item.label | translate}}</span>
          <span class="value basis-1/3">{{item.value | translate}}</span>
          <span class="date basis-1/3">{{item.date ? item.date : ''}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
