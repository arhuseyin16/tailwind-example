<div class="w-auto">
  <div class="card h-[105px] 3xl:h-[69px] flex">
    <div class="flex flex-col justify-center xl:justify-between items-start 3xl:items-center w-full 3xl:flex-row">
      <span class="label basis-0 3xl:basis-1/3 text-xs lg:text-15 xl:text-18">{{summary.label | translate}}</span>
      <span class="value basis-1/3 text-18 xl:text-25 hidden 3xl:block">{{summary.value}}</span>
      <span *ngIf="summary?.date" class="date basis-1/3 text-15 xl:text-18 hidden 3xl:block">{{summary.date ? summary.date : ''}}</span>
      <div class="flex block w-full items-center 3xl:flex-none 3xl:hidden">
        <span class="value basis-1/2 text-15 lg:text-18 xl:text-25">{{summary.value}}</span>
        <span class="date basis-1/2 text-xs lg:text-15 xl:text-18">{{summary.date ? summary.date : ''}}</span>
      </div>
    </div>
  </div>
</div>
