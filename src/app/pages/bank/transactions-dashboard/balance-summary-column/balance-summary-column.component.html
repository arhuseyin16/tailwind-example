<div class="w-auto" *ngIf="summary">
  <div class="card flex rounded-10px py-[12px] px-[11px] xl:rounded-20px xl:py-[22px] xl:px-[26px]">
    <div class="flex justify-between items-center w-full">
      <span [ngClass]="summary?.date ? 'basis-1/3 ': 'basis-1/2'" class="label uppercase text-18">{{summary.label | translate}}</span>
      <span [ngClass]="summary?.date ? 'basis-1/3 text-align-center': 'basis-1/2 text-align-right'" class="value uppercase text-25 ">{{summary.value}}</span>
      <span *ngIf="summary?.date" class="date uppercase basis-1/3 text-18">{{summary.date ? summary.date : ''}}</span>
    </div>
  </div>
</div>
