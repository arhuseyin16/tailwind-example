<div class="transactions-dashboard">
  <app-currency-flow-bar></app-currency-flow-bar>
  <div class="w-100 pl-7 pr-30px">

    <div class="grid pt-11 gap-30 grid-cols-1 md:grid-cols-3">
      <div *ngFor="let money of moneyList">
        <app-balance-summary-column [summary]="money"></app-balance-summary-column>
      </div>
    </div>

    <div class="grid pt-[31px] gap-30 grid-cols-1 xl:grid-cols-3">

      <div class="xl:col-span-2 h-[300px]">
        <div class="relative">
          <ngx-ui-loader [loaderId]="'transactions-dashboard.balance-types'" [fgsSize]="75" fgsType="ball-spin"></ngx-ui-loader>
          <app-balance-type [segmentBarConfig]="segmentBarConfigForBalanceType" [chartsOption]="balanceTypeConfig"
                            [title]="'transactions-dashboard.balance-types'"
                            (currencyChange)="balanceTypeCurrencyChange($event)"></app-balance-type>
        </div>


      </div>

      <div>
        <app-balance-type [segmentBarConfig]="segmentBarConfigForAccountType" [chartsOption]="accountTypeConfig"
                          (currencyChange)="accountTypeCurrencyChange($event)"
                          [title]="'transactions-dashboard.account-types'"></app-balance-type>
      </div>

      <div class="xl:col-span-2">
        <app-bank-accounts></app-bank-accounts>
      </div>

      <div *ngIf="currencyTotals">
        <app-currencies-summaries [currencyTotals]="currencyTotals"></app-currencies-summaries>
      </div>

    </div>

  </div>
</div>
