<nz-layout class="app-layout">
  <nz-sider class="menu-sidebar"
            nzWidth="332px"
            [nzCollapsedWidth]="121"
            nzBreakpoint="lg"
            [(nzCollapsed)]="isCollapsed"
            (nzCollapsedChange)="collapseChange($event)"
            [nzTrigger]="null">
  <app-sidebar></app-sidebar>
  </nz-sider>


  <nz-layout class="mb-[116px]">
    <nz-header>
      <div class="app-header">
        <app-header></app-header>
      </div>
    </nz-header>
    <nz-content>
      <div class="inner-content" (click)="dropdownClick()">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
