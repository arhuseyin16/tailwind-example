<div class="container-fluid">
  <form class="bank-filter-form" [formGroup]="bankFilterForm">
   <div class="form-element p-1 pr-4">
     <app-nz-select
       [fg]="bankFilterForm"
       [controlName]="bankFilterForm.value.companies"
       [formControlName]="'companies'"
       [optionList]="listOption"
       [label]="'bank-account.companies'"
       ngDefaultControl
     ></app-nz-select>
    </div>
    <div class="form-element p-1 pr-4">
      <app-nz-select
        [fg]="bankFilterForm"
        [controlName]="bankFilterForm.value.branches"
        [formControlName]="'branches'"
        [optionList]="listOption"
        ngDefaultControl
        [label]="'bank-account.branches'"
      ></app-nz-select>
    </div>
    <div class="form-element p-1 pr-4">
      <app-nz-select
        [fg]="bankFilterForm"
        [controlName]="bankFilterForm.value.accountTypes"
        [formControlName]="'accountTypes'"
        [optionList]="listOption"
        ngDefaultControl
        [label]="'bank-account.account-types'"
      ></app-nz-select>
    </div>
    <div class="form-element p-1 pr-4">
      <app-nz-select
        [fg]="bankFilterForm"
        [controlName]="bankFilterForm.value.balance"
        [formControlName]="'balance'"
        [optionList]="listOption"
        ngDefaultControl
        [label]="'bank-account.balance'"
      ></app-nz-select>
    </div>
    <div class="form-element p-1 pr-4">
      <app-nz-select
        [fg]="bankFilterForm"
        [controlName]="bankFilterForm.value.currencyUnit"
        [formControlName]="'currencyUnit'"
        [optionList]="listOption"
        ngDefaultControl
        [label]="'bank-account.currency-unit'"
      ></app-nz-select>
    </div>
    <div class="form-element pt-10">
      <button (click)="onSubmit()" class="btn-search">{{'bank-account.inquire' | translate}}</button>
    </div>
  </form>
  <div class="bank-view-option">
    <div class="bank-table">
      <img src="{{bankTableHidden ? 'assets/img/bank-account/bank-table-active.png' : 'assets/img/bank-account/bank-table.png'}}" (click)="bankViewChange('bankTable')">
    </div>
    <div class="up-line"></div>
    <div class="bank-list">
      <img src="{{bankListHidden ? 'assets/img/bank-account/bank-list-active.png' : 'assets/img/bank-account/bank-list.png'}}" (click)="bankViewChange('banklist')">
    </div>
  </div>
</div>
<div class="bank-view">
  <app-bank-table [bankList]="bankList" *ngIf="bankTableHidden"></app-bank-table>
  <app-bank-list [bankList]="bankList" *ngIf="bankListHidden"></app-bank-list>
</div>
