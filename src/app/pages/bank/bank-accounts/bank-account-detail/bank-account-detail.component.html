<app-bank-account-detail-header
  [image]="detailList.image"
  [moneyType]="detailList.moneyType"
  [account]="detailList.account"
></app-bank-account-detail-header>
<div class="detail">
  <div class="detail-table">
    <nz-table #detail [nzData]="detailList.list" nzTableLayout="fixed">
      <thead>
      <tr>
        <th *ngFor="let column of listOfColumn" [nzSortFn]="column.compare" [nzSortPriority]="column.priority">
          {{ column.title }}
        </th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let data of detail.data; let i = index" [ngStyle]="{'background-color': i%2 ? '#fff' : '#f5f5f5' }">
        <td>{{ data.date }}</td>
        <td>{{ data.definition }}</td>
        <td>{{ data.company }}</td>
        <td>{{ data.branch }}</td>
        <td>{{ data.accountType }}</td>
        <td>{{ data.accountNo }}</td>
        <td>
          <div class="last-colum-other">
            {{ data.balance }}
            <div class="accordion-img">
              <img src="assets/img/bank-account/bank-detail-accordion.png">
            </div>
            <div class="status-img">
              <img src="{{data.status ?
               'assets/img/bank-account/bank-detail-sucsess.png' : 'assets/img/bank-account/bank-detail-error.png'}}">
            </div>
            <div class="other-img" nz-dropdown nzTrigger="click" [nzDropdownMenu]="menu">
              <img src="assets/img/bank-account/bank-detail-other.png">
              <nz-dropdown-menu #menu="nzDropdownMenu">
                <ul nz-menu>
                  <li nz-menu-item>Hesap Hareketlerini Göster</li>
                </ul>
              </nz-dropdown-menu>
            </div>
          </div>
        </td>
      </tr>

  </div>
</div>
