<div class="w-full">
  <div class="bg-eton-blue rounded-t-10px px-[30px] py-[17px]">
    <div class="w-full flex justify-between">
      <div class="text-white text-20-normal">Seçili Kayıtları Sil</div>
      <div>
        <svg-icon src="assets/svg/close-icon.svg" [svgClass]="'filter-white'"
                  (click)="closeSelectModal()"></svg-icon>
      </div>
    </div>
  </div>

  <div class="pt-[38px] px-[45px]">
    <div class="text-center w-full px-[45px]">
      <div class="w-full">
        <label class="text-20-normal font-light width-full block">Silmek istediğinize emin misiniz?</label>
      </div>
      <div class="w-full mt-8">
        <label class="text-20-normal font-light width-full mt-5">Not: Sildiğiniz işlem kayıt altına alınacaktır. Daha sonra işlemi geri alabilirsiniz.</label>
      </div>
    </div>
    <div class="flex pt-[30px] pb-[42px]">
      <div class="w-full pr-2">
        <button
          class="w-full px-[98px] py-[11px] bg-white text-eton-blue border-2 border-eton-blue text-20-normal rounded-10px hover:bg-white hover:text-eton-blue focus:bg-white focus:text-eton-blue active:border-eton-blue"
          (click)="cancel()"
        >İptal</button>
      </div>
      <div class="w-full pl-2">
        <button
          class="w-full px-[84px] py-[11px] bg-eton-blue text-white text-20-normal rounded-10px hover:bg-eton-blue hover:text-white focus:bg-eton-blue focus:text-white"
          (click)="approve()"
        >Onayla</button>
      </div>
    </div>
  </div>
</div>
