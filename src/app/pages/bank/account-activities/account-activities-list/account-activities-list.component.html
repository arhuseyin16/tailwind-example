<div class="pl-7 pr-9">
  <div class="grid grid-rows-2">

    <div class="grid grid-cols-7 gap-2.5">

      <div class="col-span-3">test</div>
      <div class="w-full">
        <nz-select nzSize="large" class="w-full" nzAllowClear [nzPlaceHolder]="favoriteSelectPlaceholder">
          <nz-option nzValue="jack" nzLabel="Jack"></nz-option>
          <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
          <nz-option nzValue="disabled" nzLabel="Disabled" nzDisabled></nz-option>
        </nz-select>

        <ng-template #favoriteSelectPlaceholder>
          <span class="flex h-full items-center">
            <img src="assets/icon/star.svg"/>
            <span class="pl-[9px] text-15 text-black">{{'favorite.filters' | translate}}</span>
          </span>
        </ng-template>
      </div>

      <div class="w-full">
        <nz-select nzAllowClear nzSize="large" class="w-full" [nzPlaceHolder]="dateSelectPlaceholder">
          <nz-option nzValue="jack" nzLabel="Jack"></nz-option>
          <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
          <nz-option nzValue="disabled" nzLabel="Disabled" nzDisabled></nz-option>
        </nz-select>

        <ng-template #dateSelectPlaceholder>
          <span class="flex h-full items-center">
             <img src="assets/icon/star.svg"/>
             <span class="pl-[9px] text-15 text-black">{{'account-activities-list.date' | translate}}</span>
          </span>
        </ng-template>
      </div>

      <div class="w-[129px]">
        <nz-select nzAllowClear nzSize="large" class="w-full" [nzPlaceHolder]="allFiltersSelectPlaceholder">
          <nz-option nzValue="jack" nzLabel="Jack"></nz-option>
          <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
          <nz-option nzValue="disabled" nzLabel="Disabled" nzDisabled></nz-option>
        </nz-select>

        <ng-template #allFiltersSelectPlaceholder>
          <span class="flex h-full items-center">
             <img src="assets/icon/star.svg"/>
             <span class="pl-[9px] text-15 text-black">{{'account-activities-list.all-filters' | translate}}</span>
          </span>
        </ng-template>
      </div>

      <div class="w-full">
        <nz-select nzAllowClear nzSize="large" class="w-full" [nzPlaceHolder]="exportSelectPlaceholder">
          <nz-option nzValue="jack" nzLabel="Jack"></nz-option>
          <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
          <nz-option nzValue="disabled" nzLabel="Disabled" nzDisabled></nz-option>
        </nz-select>

        <ng-template #exportSelectPlaceholder>
          <span class="flex h-full items-center">
             <img src="assets/icon/excel.svg"/>
             <span class="pl-[9px] text-15 text-black">{{'account-activities-list.export' | translate}}</span>
          </span>
        </ng-template>
      </div>

    </div>

  </div>

  <button style="width: 20%; height: 40px; background-color: #2d64a0; color: white" (click)="detail()">DETAY</button>

</div>
