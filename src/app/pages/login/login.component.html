<div class="bg-neutral-400 w-screen h-screen">
  <div style="display: flex; justify-content: end">
    <app-translate-page></app-translate-page>
  </div>
  <div class="flex">
    <div class="logo w-1/2">
      <img src="assets/img/logo.png" >
    </div>
    <div class="form w-1/3 mx-auto my-auto">
      <nz-card class="rounded-lg">
        <form [formGroup]="loginForm">
          <div class="mt-2">
            <label>{{'username' | translate}}</label>
            <input class="rounded-lg" formControlName="username" nz-input placeholder="{{'username' | translate}}">
          </div>
          <div class="mt-8">
            <label>{{'password' | translate}}</label>
            <nz-input-group [nzSuffix]="suffixTemplate" class="rounded-lg" >
              <input
                [type]="passwordVisible ? 'text' : 'password'"
                nz-input
                placeholder="{{'password' | translate}}"
               formControlName="password"
              />
            </nz-input-group>
            <ng-template #suffixTemplate>
               <span class="cursor-pointer" nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'" (click)="passwordVisible = !passwordVisible"></span>
            </ng-template>
          </div>
          <div class="mt-5">
            <label nz-checkbox formControlName="checked">{{'remember-me' | translate}}</label>
          </div>
          <div class="mt-5">
            <button nz-button nzType="default" nzBlock (click)="loginClick()">{{'submit-login-btn' | translate}}</button>
          </div>
          <div class="mt-5 text-center">
            <label class="cursor-pointer">{{"forgot-my-password" | translate}}</label>
          </div>
        </form>
      </nz-card>
    </div>
  </div>
</div>
